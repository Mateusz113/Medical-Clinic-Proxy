# SPRING CONFIG
spring.application.name=medical_clinic_proxy
spring.output.ansi.enabled=always
server.port=8082
# FEIGN CONFIG
spring.cloud.openfeign.okhttp.enabled=true
spring.cloud.openfeign.client.config.visits-client.logger-level=full
logging.level.feign=debug
logging.level.com.mateusz113.medical_clinic_proxy.client.VisitClient=debug
# H2 DATABASE CONFIG
spring.datasource.url=jdbc:h2:mem:public
spring.datasource.driver-class-name=org.h2.Driver
